name: Publicar dashboard pela ultima Release

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - .nojekyll
      - .github/workflows/deploy-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar site e baixar JSON da ultima Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site/data

          cp index.html site/index.html

          if [ -f .nojekyll ]; then
            cp .nojekyll site/.nojekyll
          else
            touch site/.nojekyll
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"

          release_tag="$(jq -r '.tag_name' <<< "$release_json")"
          release_published="$(jq -r '.published_at' <<< "$release_json")"

          asset_name="$(
            jq -r '
              [
                .assets[]
                | select(
                    .name
                    | test("^AT1-[0-9]{2}-[0-9]{2}\\.json$"; "i")
                  )
              ]
              | sort_by(.updated_at)
              | last
              | .name // empty
            ' <<< "$release_json"
          )"

          if [ -z "$asset_name" ]; then
            echo "ERRO: nenhum arquivo AT1-AA-MM.json foi encontrado."
            echo "Release consultada: $release_tag"
            exit 1
          fi

          asset_url="$(
            jq -r \
              --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .url' \
              <<< "$release_json"
          )"

          asset_updated="$(
            jq -r \
              --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .updated_at' \
              <<< "$release_json"
          )"

          if [ -z "$asset_url" ]; then
            echo "ERRO: URL do asset $asset_name nao localizada."
            exit 1
          fi

          echo "Release localizada: $release_tag"
          echo "Asset localizado: $asset_name"
          echo "Iniciando download..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$asset_url" \
            --output site/data/latest.json

          echo "Validando o JSON..."

          jq empty site/data/latest.json

          record_count="$(
            jq '
              if type == "array" then
                length
              else
                error("O JSON precisa ser uma lista")
              end
            ' site/data/latest.json
          )"

          if [ "$record_count" -le 0 ]; then
            echo "ERRO: o JSON da Release esta vazio."
            exit 1
          fi

          file_size="$(du -h site/data/latest.json | cut -f1)"

          jq -n \
            --arg releaseTag "$release_tag" \
            --arg releasePublishedAt "$release_published" \
            --arg assetName "$asset_name" \
            --arg assetUpdatedAt "$asset_updated" \
            --arg fileSize "$file_size" \
            --argjson registros "$record_count" \
            '{
              versao: 1,
              origem: "github-release",
              releaseTag: $releaseTag,
              releasePublishedAt: $releasePublishedAt,
              assetName: $assetName,
              assetUpdatedAt: $assetUpdatedAt,
              fileSize: $fileSize,
              registros: $registros
            }' \
            > site/data/manifest.json

          echo "Release: $release_tag"
          echo "Asset: $asset_name"
          echo "Tamanho: $file_size"
          echo "Registros: $record_count"
          echo "Preparacao concluida."

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
