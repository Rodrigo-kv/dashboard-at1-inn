name: Deploy Pages from Release

on:
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do index
        uses: actions/checkout@v4

      - name: Baixar arquivos da ultima Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets release-expanded _site
          mkdir -p release-assets release-expanded _site/data

          gh release download --repo "$GITHUB_REPOSITORY" --dir release-assets

          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERRO: a ultima Release nao possui assets."
            exit 1
          fi

          find release-assets -maxdepth 1 -type f -print

      - name: Preparar assets da Release
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            case "$name" in
              *.zip)
                dir="release-expanded/${name%.zip}"
                mkdir -p "$dir"
                unzip -q "$file" -d "$dir"
                ;;
              *.tar.gz|*.tgz)
                dir="release-expanded/${name%%.tar.gz}"
                dir="${dir%%.tgz}"
                mkdir -p "$dir"
                tar -xzf "$file" -C "$dir"
                ;;
              *.json)
                cp "$file" release-expanded/
                ;;
            esac
          done < <(find release-assets -maxdepth 1 -type f -print0)

          manifest=$(find release-expanded -type f -name manifest.json -print -quit)
          if [ -z "$manifest" ]; then
            echo "ERRO: manifest.json nao foi encontrado nos assets da ultima Release."
            exit 1
          fi

          manifest_dir=$(dirname "$manifest")
          cp -R "$manifest_dir"/. _site/data/
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Validar manifesto e arquivos mensais
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/data/manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('_site')
          manifest_path = root / 'data' / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))

          entries = manifest.get('months') or manifest.get('history') or manifest.get('files')
          if not isinstance(entries, list) or not entries:
              raise SystemExit('ERRO: manifesto sem months/history/files validos')

          seen = set()
          checked = 0
          for item in entries:
              if isinstance(item, str):
                  rel = item
                  month = item
                  expected = None
              elif isinstance(item, dict):
                  rel = item.get('path') or item.get('file') or item.get('url')
                  month = item.get('month') or item.get('competencia') or rel
                  expected = item.get('records')
              else:
                  raise SystemExit(f'ERRO: entrada invalida no manifesto: {item!r}')

              if not rel or str(rel).startswith(('http://', 'https://')):
                  continue
              if month in seen:
                  raise SystemExit(f'ERRO: competencia duplicada: {month}')
              seen.add(month)

              clean = str(rel).split('?', 1)[0].split('#', 1)[0].lstrip('./')
              candidates = [root / clean, root / 'data' / clean]
              file_path = next((p for p in candidates if p.is_file()), None)
              if file_path is None:
                  raise SystemExit(f'ERRO: arquivo do manifesto nao encontrado: {rel}')

              payload = json.loads(file_path.read_text(encoding='utf-8-sig'))
              rows = payload if isinstance(payload, list) else payload.get('rows') or payload.get('data')
              if not isinstance(rows, list) or not rows:
                  raise SystemExit(f'ERRO: arquivo vazio ou invalido: {file_path}')
              if expected is not None and len(rows) != expected:
                  raise SystemExit(
                      f'ERRO: quantidade divergente em {month}: manifesto={expected}, arquivo={len(rows)}'
                  )
              checked += 1

          if checked == 0:
              raise SystemExit('ERRO: nenhum arquivo local do manifesto foi validado')
          print(f'OK: manifesto e {checked} arquivos de dados validados.')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
