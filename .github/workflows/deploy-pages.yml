name: Deploy Pages from Releases

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/deploy-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JSON assets from all Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets _site
          mkdir -p release-assets _site/data/history

          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease,publishedAt --jq '.[] | select(.isDraft == false) | .tagName')
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "ERROR: no published Release was found."
            exit 1
          fi

          i=0
          for tag in "${tags[@]}"; do
            printf -v order '%03d' "$i"
            target="release-assets/${order}"
            mkdir -p "$target"
            echo "Downloading JSON assets from Release: $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$target" --pattern '*.json' || true
            i=$((i + 1))
          done

          count=$(find release-assets -type f -name '*.json' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: published Releases do not contain JSON assets."
            exit 1
          fi
          find release-assets -type f -name '*.json' -print

      - name: Build permanent monthly history and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path('release-assets')
          site = Path('_site')
          history = site / 'data' / 'history'
          history.mkdir(parents=True, exist_ok=True)

          def norm(value):
              import unicodedata
              text = unicodedata.normalize('NFD', str(value or ''))
              return re.sub(r'[^A-Z0-9]', '', ''.join(c for c in text if unicodedata.category(c) != 'Mn').upper())

          def date_key(row):
              keys = {norm(k): k for k in row.keys()}
              key = keys.get('DATANOTA') or keys.get('DATA') or keys.get('DTNOTA')
              if not key:
                  return ''
              value = str(row.get(key, '')).strip()[:10]
              if re.fullmatch(r'\d{4}-\d{2}-\d{2}', value):
                  return value
              match = re.fullmatch(r'(\d{2})/(\d{2})/(\d{4})', value)
              return f'{match.group(3)}-{match.group(2)}-{match.group(1)}' if match else ''

          # Release directories are numbered newest first. The newest asset wins if a month repeats.
          selected = {}
          origins = {}
          files = sorted(source.glob('*/*.json'))
          for path in files:
              try:
                  payload = json.loads(path.read_text(encoding='utf-8-sig'))
              except Exception as exc:
                  raise SystemExit(f'ERROR: invalid JSON {path}: {exc}')
              rows = payload if isinstance(payload, list) else payload.get('rows') or payload.get('data')
              if not isinstance(rows, list) or not rows:
                  print(f'WARNING: ignored non-tabular or empty JSON: {path}')
                  continue

              by_month = {}
              for position, row in enumerate(rows, start=1):
                  if not isinstance(row, dict):
                      raise SystemExit(f'ERROR: non-object record in {path}, position {position}')
                  date = date_key(row)
                  month = date[:7]
                  if not re.fullmatch(r'\d{4}-(0[1-9]|1[0-2])', month):
                      raise SystemExit(f'ERROR: record without valid competence in {path}, position {position}')
                  by_month.setdefault(month, []).append(row)

              for month, month_rows in by_month.items():
                  if month not in selected:
                      selected[month] = month_rows
                      origins[month] = str(path)
                  else:
                      print(f'WARNING: {month} from {path} ignored; newer source already selected: {origins[month]}')

          if not selected:
              raise SystemExit('ERROR: no valid monthly records were found in Releases.')

          entries = []
          for month in sorted(selected):
              rows = selected[month]
              rel = f'history/{month}.json'
              target = site / 'data' / rel
              target.write_text(json.dumps(rows, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              entries.append({'month': month, 'path': rel, 'records': len(rows), 'source': origins[month]})

          latest = entries[-1]
          shutil.copyfile(site / 'data' / latest['path'], site / 'data' / 'latest.json')
          manifest = {
              'schemaVersion': 2,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'source': 'GitHub Releases',
              'months': [{k: item[k] for k in ('month', 'path', 'records')} for item in entries],
              'latest': 'latest.json'
          }
          (site / 'data' / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('Built months:', ', '.join(f"{e['month']} ({e['records']})" for e in entries))
          PY

      - name: Prepare and validate Pages site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s _site/data/manifest.json
          cp index.html _site/index.html
          touch _site/.nojekyll

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('_site/data')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          months = manifest.get('months')
          if manifest.get('schemaVersion') != 2 or not isinstance(months, list) or not months:
              raise SystemExit('ERROR: invalid schemaVersion 2 manifest.')
          seen = set()
          for item in months:
              month, rel, records = item.get('month'), item.get('path'), item.get('records')
              if month in seen:
                  raise SystemExit(f'ERROR: duplicated competence: {month}')
              seen.add(month)
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f'ERROR: missing monthly file: {path}')
              data = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(data, list) or len(data) != records:
                  raise SystemExit(f'ERROR: record count mismatch for {month}')
          print(f'Validation OK: {len(months)} month(s).')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
